        <rect x="-14" y="-122" width="28" height="36" rx="3" transform="rotate(45)"/><rect x="-14" y="-122" width="28" height="36" rx="3" transform="rotate(135)"/>
        <rect x="-14" y="-122" width="28" height="36" rx="3" transform="rotate(225)"/><rect x="-14" y="-122" width="28" height="36" rx="3" transform="rotate(315)"/>
