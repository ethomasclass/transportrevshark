      <circle cx="325" cy="52" r="40"/><circle cx="268" cy="70" r="30"/><circle cx="224" cy="86" r="20"/>
    </g>
    <!-- stack -->
    <rect x="512" y="78" width="36" height="232" fill="#1f2a36"/>
    <rect x="504" y="70" width="52" height="22" rx="4" fill="#e2b95a"/>
    <rect x="512" y="150" width="36" height="16" fill="#b3342e"/>
