    <rect x="110" y="236" width="230" height="74" rx="6" fill="#fbf6ea"/>
    <rect x="98" y="222" width="254" height="20" rx="5" fill="#b3342e"/>
    <g fill="#7fb0c4" stroke-width="5"><rect x="130" y="258" width="34" height="28" rx="4"/><rect x="182" y="258" width="34" height="28" rx="4"/><rect x="234" y="258" width="34" height="28" rx="4"/><rect x="286" y="258" width="34" height="28" rx="4"/></g>
    <!-- deck railing -->
